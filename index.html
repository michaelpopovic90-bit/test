<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="A simple, mobile-friendly 3x3 Rubik's Cube scramble generator.">
  <title>Cube Scramble</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 16px; background: #101827; color: #f8fafc; }
    main { width: min(100%, 620px); text-align: center; }
    .badge { display: inline-block; padding: 6px 11px; border: 1px solid #334155; border-radius: 999px; color: #cbd5e1; font-size: .8rem; letter-spacing: .04em; }
    h1 { margin: 14px 0 6px; font-size: clamp(2rem, 9vw, 3.2rem); letter-spacing: -.05em; }
    .hint { margin: 0 0 22px; color: #94a3b8; }

    /* Small cube illustration: a clear, decorative 3x3 view, not a simulator. */
    .cube { width: 124px; height: 108px; position: relative; margin: 0 auto 24px; }
    .face { position: absolute; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; padding: 4px; border: 2px solid #0b1220; border-radius: 5px; }
    .face span { border: 1px solid #0b1220; border-radius: 2px; }
    .front { width: 78px; height: 78px; left: 7px; bottom: 1px; transform: skewY(0deg); background: #dc2626; }
    .front span { background: #ef4444; }
    .right { width: 45px; height: 78px; right: 2px; bottom: 1px; transform: skewY(-32deg); transform-origin: left bottom; background: #f97316; }
    .right span { background: #fb923c; }
    .top { width: 78px; height: 44px; left: 28px; top: 0; transform: skewX(-58deg); transform-origin: left bottom; background: #eab308; }
    .top span { background: #facc15; }

    .settings { margin: 0 auto 14px; padding: 16px 18px; border: 1px solid #263449; border-radius: 16px; background: #172235; text-align: left; }
    .slider-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .slider-heading label { color: #cbd5e1; font-weight: 650; }
    output { color: #7dd3fc; font-weight: 750; font-variant-numeric: tabular-nums; }
    input[type="range"] { display: block; width: 100%; min-height: 28px; margin: 0; accent-color: #38bdf8; cursor: pointer; touch-action: pan-y; }
    input[type="range"]:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; border-radius: 8px; }
    .range-labels { display: flex; justify-content: space-between; color: #94a3b8; font-size: .75rem; }
    .scramble { min-height: 112px; display: flex; align-items: center; justify-content: center; padding: 20px; border: 1px solid #263449; border-radius: 16px; background: #172235; font-size: clamp(1.15rem, 4.7vw, 1.65rem); font-weight: 650; line-height: 1.8; letter-spacing: .045em; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 12px; margin-top: 14px; }
    button { min-height: 50px; flex: 1; padding: 12px 16px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .primary { background: #38bdf8; color: #082f49; }
    .secondary { background: #263449; color: #f8fafc; }
    .note { margin-top: 18px; color: #94a3b8; font-size: .85rem; }
    @media (max-width: 380px) { .actions { flex-direction: column; } }
    @media (prefers-reduced-motion: no-preference) { button { transition: filter .15s ease, transform .15s ease; } button:hover { filter: brightness(1.08); } button:active { transform: scale(.98); } }
  </style>
</head>
<body>
  <main>
    <span class="badge">3 × 3 × 3</span>
    <h1>Cube Scramble</h1>
    <p class="hint">Set the move count, then scramble.</p>

    <div class="cube" role="img" aria-label="Illustration of a colorful 3 by 3 Rubik's Cube">
      <div class="face top" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="face front" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="face right" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>

    <section class="settings" aria-label="Scramble settings">
      <div class="slider-heading">
        <label for="length">Scramble length</label>
        <output id="lengthValue" for="length">20 moves</output>
      </div>
      <input id="length" type="range" min="10" max="40" step="1" value="20">
      <div class="range-labels" aria-hidden="true"><span>10</span><span>40 moves</span></div>
    </section>

    <div class="scramble" id="scramble" aria-live="polite" aria-label="Scramble sequence"></div>
    <div class="actions">
      <button class="primary" id="newScramble" type="button">New scramble</button>
      <button class="secondary" id="copyScramble" type="button">Copy scramble</button>
    </div>
    <p class="note">Notation: ' = counterclockwise · 2 = half turn</p>
  </main>
  <script>
    const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
    const turns = ['', "'", '2'];
    const scrambleEl = document.querySelector('#scramble');
    const lengthSlider = document.querySelector('#length');
    const lengthValue = document.querySelector('#lengthValue');
    const copyButton = document.querySelector('#copyScramble');

    function randomIndex(max) {
      if (window.crypto && crypto.getRandomValues) {
        const value = new Uint32Array(1);
        crypto.getRandomValues(value);
        return value[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function makeScramble(length) {
      const moves = [];
      let previousFace = '';
      while (moves.length < length) {
        const face = faces[randomIndex(faces.length)];
        // Avoid consecutive turns of the same face.
        if (face === previousFace) continue;
        moves.push(face + turns[randomIndex(turns.length)]);
        previousFace = face;
      }
      return moves.join(' ');
    }

    function updateScramble() {
      scrambleEl.textContent = makeScramble(Number(lengthSlider.value));
      copyButton.textContent = 'Copy scramble';
    }

    lengthSlider.addEventListener('input', () => {
      lengthValue.textContent = `${lengthSlider.value} ${Number(lengthSlider.value) === 1 ? 'move' : 'moves'}`;
    });
    lengthSlider.addEventListener('change', updateScramble);
    document.querySelector('#newScramble').addEventListener('click', updateScramble);
    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(scrambleEl.textContent);
        copyButton.textContent = 'Copied!';
      } catch {
        copyButton.textContent = 'Copy unavailable';
      }
    });
    updateScramble();
  </script>
</body>
</html>
