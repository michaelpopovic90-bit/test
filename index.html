<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="A simple, mobile-friendly 3x3 Rubik's Cube scramble generator.">
  <title>Cube Scramble</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1725;
      --bg-2: #111d2d;
      --panel: #1a2a3b;
      --panel-strong: #1d2e42;
      --panel-soft: #203047;
      --stroke: rgba(148, 163, 184, 0.32);
      --text: #f5f7fb;
      --muted: #9aa9bb;
      --blue: #5ab1f4;
      --blue-strong: #48a8f6;
      --gray: #dfe7ef;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: rgba(2, 6, 23, 0.5);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background: #0b1220;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 0;
    }

    .phone {
      width: min(100vw, 420px);
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg) 0%, #101d2c 100%);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.55);
      position: relative;
      overflow: hidden;
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 10px 18px 0;
      font-weight: 700;
      color: rgba(255,255,255,0.96);
      font-size: 1.1rem;
      letter-spacing: .02em;
    }

    .statusbar .right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.96;
    }

    .signal {
      position: relative;
      width: 26px;
      height: 18px;
    }

    .signal::before,
    .signal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        transparent 0 12%,
        rgba(255,255,255,0.95) 12% 18%,
        transparent 18% 100%);
      clip-path: polygon(0 100%, 18% 100%, 18% 52%, 30% 52%, 30% 32%, 42% 32%, 42% 18%, 55% 18%, 55% 8%, 70% 8%, 70% 0, 100% 0, 100% 100%, 0 100%);
      opacity: 0.75;
    }

    .battery {
      width: 22px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 4px;
      position: relative;
      display: inline-block;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 6px;
      border-radius: 2px;
      background: rgba(255,255,255,0.8);
    }

    .battery::before {
      content: "";
      position: absolute;
      inset: 2px 2px 2px 2px;
      border-radius: 2px;
      background: rgba(255,255,255,0.9);
    }

    .badge-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 18px;
      padding: 0 7px;
      border-radius: 7px;
      background: #d33c3c;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .app-shell {
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      min-height: calc(100vh - 60px);
      background: linear-gradient(180deg, rgba(10, 17, 27, 0.1) 0%, rgba(15, 23, 42, 0) 30%);
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
      text-align: center;
      padding: 10px 22px 18px;
    }

    .badge {
      display: inline-block;
      min-width: 110px;
      padding: 7px 18px 8px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      border-radius: 999px;
      color: #dfe7f8;
      font-size: 0.86rem;
      letter-spacing: 0.02em;
      background: rgba(148, 163, 184, 0.02);
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(2.6rem, 8vw, 5.2rem);
      line-height: 0.96;
      letter-spacing: -0.08em;
      font-weight: 800;
      color: #f8fafc;
    }

    .hint {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.7vw, 1.8rem);
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .cube {
      width: 150px;
      height: 120px;
      position: relative;
      margin: 0 auto 28px;
      filter: drop-shadow(0 10px 12px rgba(15, 23, 42, 0.25));
      transform: translateX(6px);
    }

    .face {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border: 2px solid rgba(13, 21, 30, 0.88);
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .face span {
      border: 1px solid rgba(13, 21, 30, 0.9);
      border-radius: 2px;
    }

    .front {
      width: 86px;
      height: 86px;
      left: 26px;
      bottom: 6px;
      background: #d32f2f;
    }

    .front span { background: #ef4444; }

    .right {
      width: 54px;
      height: 86px;
      right: 18px;
      bottom: 10px;
      transform: skewY(-32deg);
      transform-origin: left bottom;
      background: #f59e0b;
    }

    .right span { background: #fbbf24; }

    .top {
      width: 86px;
      height: 48px;
      left: 40px;
      top: 10px;
      transform: skewX(-58deg);
      transform-origin: left bottom;
      background: #facc15;
    }

    .top span { background: #fde68a; }

    .settings {
      margin: 0 auto 18px;
      padding: 18px 20px 16px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 18px;
      background: rgba(24, 38, 58, 0.9);
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .slider-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .slider-heading label {
      font-weight: 700;
      font-size: clamp(1.05rem, 3vw, 1.55rem);
      color: #e2e8f0;
      letter-spacing: -0.04em;
    }

    output {
      color: #7dd3fc;
      font-weight: 800;
      font-size: clamp(1.05rem, 3vw, 1.65rem);
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      min-height: 34px;
      margin: 0;
      accent-color: #48a8f6;
      cursor: pointer;
      touch-action: pan-y;
      background: transparent;
    }

    input[type="range"]:focus-visible {
      outline: 3px solid rgba(147, 197, 253, 0.9);
      outline-offset: 4px;
      border-radius: 8px;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: rgba(148, 163, 184, 0.96);
      font-size: 0.78rem;
      letter-spacing: -0.02em;
    }

    .scramble {
      min-height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      background: rgba(24, 38, 58, 0.9);
      color: #f8fafc;
      font-size: clamp(1.2rem, 3vw, 2.35rem);
      line-height: 1.25;
      letter-spacing: -0.05em;
      text-align: center;
      font-weight: 700;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      min-height: 60px;
      flex: 1;
      padding: 12px 18px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 800;
      font-size: clamp(1.15rem, 3vw, 1.8rem);
      letter-spacing: -0.04em;
      cursor: pointer;
      touch-action: manipulation;
      transition: filter .15s ease, transform .15s ease, background-color .15s ease;
    }

    button:focus-visible {
      outline: 3px solid rgba(147, 197, 253, 0.9);
      outline-offset: 3px;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:active {
      transform: scale(0.985);
    }

    .primary {
      background: linear-gradient(180deg, #62baf2 0%, #49a7ee 100%);
      color: #082343;
    }

    .secondary {
      background: rgba(72, 92, 120, 0.9);
      color: #edf6ff;
    }

    .note {
      margin-top: 18px;
      color: rgba(148, 163, 184, 0.96);
      font-size: 0.88rem;
      letter-spacing: -0.02em;
    }

    .footer-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 18px;
      padding: 8px 18px 12px;
      color: #dfe7ef;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(11, 17, 27, 0.2);
    }

    .address-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      max-width: 500px;
      margin: 10px auto 0;
      padding: 10px 14px 9px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.26);
      background: rgba(24, 38, 58, 0.88);
      color: #dfe7ef;
      font-size: 1.1rem;
      letter-spacing: -0.03em;
    }

    .address-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .icon-globe {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(203, 213, 225, 0.9);
      position: relative;
      display: inline-block;
    }

    .icon-globe::before,
    .icon-globe::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .icon-globe::before {
      background: linear-gradient(90deg, transparent 48%, rgba(203,213,225,0.9) 48% 52%, transparent 52%),
                  linear-gradient(transparent 48%, rgba(203,213,225,0.9) 48% 52%, transparent 52%);
      transform: scale(1.1);
    }

    .icon-globe::after {
      inset: 4px;
      border: 2px solid rgba(203,213,225,0.9);
      border-top-color: transparent;
      border-bottom-color: transparent;
      transform: scale(0.95);
    }

    .icon-share {
      width: 20px;
      height: 20px;
      position: relative;
      display: inline-block;
    }

    .icon-share::before,
    .icon-share::after,
    .icon-share span {
      content: "";
      position: absolute;
      background: rgba(203, 213, 225, 0.9);
      border-radius: 2px;
    }

    .icon-share::before {
      width: 12px;
      height: 2px;
      right: 1px;
      top: 8px;
      transform: rotate(45deg);
    }

    .icon-share::after {
      width: 12px;
      height: 2px;
      left: 1px;
      top: 8px;
      transform: rotate(-45deg);
    }

    .icon-share span {
      width: 2px;
      height: 12px;
      left: 9px;
      top: 1px;
      transform: rotate(45deg);
    }

    .browser-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 0;
      margin-top: 10px;
    }

    .nav-arrow {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      opacity: 0.9;
      font-size: 2rem;
      line-height: 1;
    }

    .nav-center {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      color: #f8fafc;
      font-weight: 300;
      font-size: 2.2rem;
      line-height: 1;
    }

    .nav-pill {
      min-width: 56px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      color: #e2e8f0;
      font-weight: 700;
      font-size: 1rem;
    }

    .nav-dots {
      font-size: 2.7rem;
      line-height: 0.7;
      letter-spacing: -0.1em;
      color: #f8fafc;
      opacity: 0.85;
      transform: translateY(-3px);
    }

    @media (max-width: 420px) {
      .phone {
        width: 100vw;
      }
      main {
        padding-left: 20px;
        padding-right: 20px;
      }
      .actions {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      button { transition: filter .15s ease, transform .15s ease; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <div>20:13</div>
      <div class="right">
        <div class="status-icons">
          <div class="signal" aria-hidden="true"></div>
          <div class="battery" aria-hidden="true"></div>
        </div>
        <span class="badge-pill">16</span>
      </div>
    </div>

    <div class="app-shell">
      <main>
        <div class="badge">3 × 3 × 3</div>

        <h1>Cube Scramble</h1>
        <p class="hint">Set the move count, then scramble.</p>

        <div class="cube" role="img" aria-label="Illustration of a colorful 3 by 3 Rubik's Cube">
          <div class="face top" aria-hidden="true">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <div class="face front" aria-hidden="true">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <div class="face right" aria-hidden="true">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
        </div>

        <section class="settings" aria-label="Scramble settings">
          <div class="slider-heading">
            <label for="length">Scramble length</label>
            <output id="lengthValue" for="length">20 moves</output>
          </div>
          <input id="length" type="range" min="10" max="40" step="1" value="20">
          <div class="range-labels" aria-hidden="true">
            <span>10</span>
            <span>40 moves</span>
          </div>
        </section>

        <div class="scramble" id="scramble" aria-live="polite" aria-label="Scramble sequence"></div>

        <div class="actions">
          <button class="primary" id="newScramble" type="button">New scramble</button>
          <button class="secondary" id="copyScramble" type="button">Copy scramble</button>
        </div>

        <div class="note">Notation: ' = counterclockwise · 2 = half turn</div>

        <div class="address-bar" aria-label="Page address bar">
          <div class="address-left">
            <span class="icon-globe" aria-hidden="true"></span>
            <span>michaelpopovic90-bit.github.io</span>
          </div>
          <span class="icon-share" aria-hidden="true"><span></span></span>
        </div>

        <div class="browser-nav" aria-label="Browser navigation">
          <span class="nav-arrow" aria-hidden="true">←</span>
          <span class="nav-arrow" aria-hidden="true">→</span>
          <span class="nav-center" aria-hidden="true">＋</span>
          <span class="nav-pill">32</span>
          <span class="nav-dots" aria-hidden="true">•••</span>
        </div>
      </main>
    </div>
  </div>

  <script>
    const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
    const turns = ['', "'", '2'];
    const scrambleEl = document.querySelector('#scramble');
    const lengthSlider = document.querySelector('#length');
    const lengthValue = document.querySelector('#lengthValue');
    const copyButton = document.querySelector('#copyScramble');

    function randomIndex(max) {
      if (window.crypto && crypto.getRandomValues) {
        const value = new Uint32Array(1);
        crypto.getRandomValues(value);
        return value[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function makeScramble(length) {
      const moves = [];
      let previousFace = '';
      while (moves.length < length) {
        const face = faces[randomIndex(faces.length)];
        if (face === previousFace) continue;
        moves.push(face + turns[randomIndex(turns.length)]);
        previousFace = face;
      }
      return moves.join(' ');
    }

    function updateScramble() {
      scrambleEl.textContent = makeScramble(Number(lengthSlider.value));
      copyButton.textContent = 'Copy scramble';
    }

    lengthSlider.addEventListener('input', () => {
      lengthValue.textContent = `${lengthSlider.value} ${Number(lengthSlider.value) === 1 ? 'move' : 'moves'}`;
    });

    lengthSlider.addEventListener('change', updateScramble);
    document.querySelector('#newScramble').addEventListener('click', updateScramble);

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(scrambleEl.textContent);
        copyButton.textContent = 'Copied!';
      } catch {
        copyButton.textContent = 'Copy unavailable';
      }
    });

    updateScramble();
  </script>
</body>
</html>
