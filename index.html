<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="A simple, mobile-friendly 3x3 Rubik's Cube scramble generator.">
  <title>Cube Scramble</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page: #101827;
      --panel: #182438;
      --panel-border: #29384d;
      --text: #f7f8fb;
      --muted: #9aa8bc;
      --accent: #38bdf8;
      --accent-ink: #082f49;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: clamp(42px, 8vh, 82px) 16px 36px;
      background: radial-gradient(ellipse at 50% 12%, #172338 0, var(--page) 52%);
      color: var(--text);
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 5px 16px;
      border: 1.5px solid #35445a;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 1.1rem;
      letter-spacing: .025em;
    }

    h1 {
      margin: 21px 0 8px;
      font-size: clamp(2.5rem, 9.2vw, 4.5rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 780;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 4vw, 1.65rem);
      line-height: 1.4;
      letter-spacing: -.035em;
    }

    .cube-art {
      display: block;
      width: min(220px, 58vw);
      height: auto;
      margin: 20px auto 28px;
      overflow: visible;
      filter: drop-shadow(0 13px 15px rgb(0 0 0 / 22%));
    }

    .panel {
      border: 1.5px solid var(--panel-border);
      border-radius: 22px;
      background: var(--panel);
    }

    .settings {
      padding: 20px 20px 17px;
      text-align: left;
      margin-bottom: 14px;
    }

    .slider-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .slider-heading label {
      color: #cbd5e1;
      font-size: clamp(1.15rem, 4.3vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -.04em;
    }

    output {
      color: #7dd3fc;
      font-size: clamp(1.15rem, 4.3vw, 1.55rem);
      font-weight: 750;
      letter-spacing: -.035em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      --progress: 26.67%;
      display: block;
      width: 100%;
      height: 32px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border: 1px solid #050a12;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0 var(--progress), #050a12 var(--progress) 100%);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border: 1px solid #050a12;
      border-radius: 999px;
      background: #050a12;
    }

    input[type="range"]::-moz-range-progress {
      height: 7px;
      border: 1px solid #050a12;
      border-radius: 999px;
      background: var(--accent);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 24px;
      height: 24px;
      margin-top: -10px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgb(0 0 0 / 32%);
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgb(0 0 0 / 32%);
    }

    input[type="range"]:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 5px;
      border-radius: 8px;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: -.02em;
    }

    .scramble {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 18px;
      color: var(--text);
      font-size: clamp(1.3rem, 5vw, 2rem);
      font-weight: 720;
      line-height: 1.55;
      letter-spacing: .045em;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      min-width: 0;
      min-height: 62px;
      flex: 1;
      padding: 12px 14px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: clamp(1.1rem, 4.7vw, 1.7rem);
      font-weight: 750;
      letter-spacing: -.04em;
      cursor: pointer;
      touch-action: manipulation;
      transition: filter .16s ease, transform .16s ease;
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(.985); }

    .primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .secondary {
      background: #263449;
      color: var(--text);
    }

    .note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: clamp(.92rem, 3.5vw, 1.15rem);
      line-height: 1.5;
      letter-spacing: -.025em;
    }

    @media (min-width: 700px) {
      body { padding-top: 56px; }
      .settings { padding: 24px 28px 20px; }
      .scramble { min-height: 150px; padding: 26px; }
      .actions { gap: 16px; margin-top: 18px; }
      button { min-height: 72px; }
    }

    @media (max-width: 360px) {
      body { padding-right: 12px; padding-left: 12px; }
      .settings { padding: 17px 15px 14px; }
      .actions { gap: 9px; }
      button { min-height: 56px; padding-inline: 8px; font-size: 1.05rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">3 × 3 × 3</span>
    <h1>Cube Scramble</h1>
    <p class="hint">Set the move count, then scramble.</p>

    <svg class="cube-art" viewBox="0 0 220 170" role="img" aria-labelledby="cube-title">
      <title id="cube-title">Colorful three-sided 3 by 3 cube illustration</title>
      <g stroke="#080e18" stroke-width="3.5" stroke-linejoin="round">
        <!-- Top face -->
        <path d="M38 61 113 16h92l-75 45z" fill="#facc15"/>
        <g fill="#facc15" stroke-width="2.5">
          <path d="m61 57 21-13h21L82 57z"/><path d="m96 57 21-13h21l-21 13z"/><path d="m131 57 21-13h21l-21 13z"/>
          <path d="m50 47 21-13h21L71 47z"/><path d="m85 47 21-13h21l-21 13z"/><path d="m120 47 21-13h21l-21 13z"/>
          <path d="m75 34 21-13h21L96 34z"/><path d="m110 34 21-13h21l-21 13z"/><path d="m145 34 21-13h21l-21 13z"/>
        </g>
        <!-- Front face -->
        <path d="M22 65a8 8 0 0 1 8-8h100v103a8 8 0 0 1-8 8H30a8 8 0 0 1-8-8z" fill="#dc2626"/>
        <g fill="#ef4444" stroke-width="2.5">
          <rect x="31" y="67" width="27" height="27" rx="3"/><rect x="65" y="67" width="27" height="27" rx="3"/><rect x="99" y="67" width="27" height="27" rx="3"/>
          <rect x="31" y="101" width="27" height="27" rx="3"/><rect x="65" y="101" width="27" height="27" rx="3"/><rect x="99" y="101" width="27" height="27" rx="3"/>
          <rect x="31" y="135" width="27" height="27" rx="3"/><rect x="65" y="135" width="27" height="27" rx="3"/><rect x="99" y="135" width="27" height="27" rx="3"/>
        </g>
        <!-- Right face -->
        <path d="M130 58 202 15v101a9 9 0 0 1-4 8l-68 43z" fill="#f97316"/>
        <g fill="#fb923c" stroke-width="2.5">
          <path d="m137 67 19-12v25l-19 12z"/><path d="m164 51 19-12v25l-19 12z"/><path d="m190 35 9-6v25l-9 6z"/>
          <path d="m137 99 19-12v25l-19 12z"/><path d="m164 83 19-12v25l-19 12z"/><path d="m190 67 9-6v25l-9 6z"/>
          <path d="m137 131 19-12v25l-19 12z"/><path d="m164 115 19-12v25l-19 12z"/><path d="m190 99 9-6v25l-9 6z"/>
        </g>
      </g>
    </svg>

    <section class="settings panel" aria-label="Scramble settings">
      <div class="slider-heading">
        <label for="length">Scramble length</label>
        <output id="lengthValue" for="length">18 moves</output>
      </div>
      <input id="length" type="range" min="10" max="40" step="1" value="18" aria-label="Scramble length in moves">
      <div class="range-labels" aria-hidden="true"><span>10</span><span>40 moves</span></div>
    </section>

    <div class="scramble panel" id="scramble" aria-live="polite" aria-label="Scramble sequence"></div>

    <div class="actions">
      <button class="primary" id="newScramble" type="button">New scramble</button>
      <button class="secondary" id="copyScramble" type="button">Copy scramble</button>
    </div>
    <p class="note">Notation: ' = counterclockwise · 2 = half turn</p>
  </main>

  <script>
    const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
    const turns = ['', "'", '2'];
    const scrambleEl = document.querySelector('#scramble');
    const lengthSlider = document.querySelector('#length');
    const lengthValue = document.querySelector('#lengthValue');
    const copyButton = document.querySelector('#copyScramble');

    function randomIndex(max) {
      if (window.crypto?.getRandomValues) {
        const value = new Uint32Array(1);
        crypto.getRandomValues(value);
        return value[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function makeScramble(length) {
      const moves = [];
      let previousFace = '';
      while (moves.length < length) {
        const face = faces[randomIndex(faces.length)];
        if (face === previousFace) continue;
        moves.push(face + turns[randomIndex(turns.length)]);
        previousFace = face;
      }
      return moves.join(' ');
    }

    function updateScramble() {
      scrambleEl.textContent = makeScramble(Number(lengthSlider.value));
      copyButton.textContent = 'Copy scramble';
    }

    function updateLength() {
      const length = Number(lengthSlider.value);
      lengthValue.textContent = `${length} ${length === 1 ? 'move' : 'moves'}`;
      const progress = ((length - Number(lengthSlider.min)) / (Number(lengthSlider.max) - Number(lengthSlider.min))) * 100;
      lengthSlider.style.setProperty('--progress', `${progress}%`);
    }

    lengthSlider.addEventListener('input', updateLength);
    lengthSlider.addEventListener('change', updateScramble);
    document.querySelector('#newScramble').addEventListener('click', updateScramble);

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(scrambleEl.textContent);
        copyButton.textContent = 'Copied!';
      } catch {
        copyButton.textContent = 'Copy unavailable';
      }
    });

    updateLength();
    updateScramble();
  </script>
</body>
</html>
